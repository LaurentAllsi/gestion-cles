<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestion des Clés - Agence Immobilière</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Microsoft Authentication Library (MSAL) -->
  <script src="https://alcdn.msauth.net/browser/2.38.1/js/msal-browser.min.js"></script>
  <!-- SheetJS pour Excel -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <!-- Microsoft Teams JS SDK : permet de fonctionner en onglet Teams (non bloquant hors Teams) -->
  <script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100">
  <!-- CRITIQUE : initialisation Teams AVANT Babel (qui prend 2-3s à compiler).
       Sans cet appel précoce, Teams Desktop timeout et bloque l'iframe. -->
  <script>
    (function () {
      var attempts = 0;
      function tryInit() {
        attempts++;
        if (window.microsoftTeams && window.microsoftTeams.app && typeof window.microsoftTeams.app.initialize === 'function') {
          window.microsoftTeams.app.initialize()
            .then(function () {
              try {
                if (typeof window.microsoftTeams.app.notifySuccess === 'function') {
                  window.microsoftTeams.app.notifySuccess();
                  console.log('[early] Teams notifySuccess envoyé');
                }
              } catch (e) { console.warn('[early] notifySuccess failed', e); }
              window.__teamsInitialized = true;
            })
            .catch(function () { /* hors Teams */ });
        } else if (attempts < 40) {
          // Le SDK Teams n'est pas encore chargé, on retente
          setTimeout(tryInit, 25);
        }
      }
      tryInit();
    })();
  </script>

  <div id="root"></div>

  <script>
const {
  useState,
  useEffect
} = React;

// --- Helpers date/heure ---
const todayDate = () => {
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
};
const nowTime = () => {
  const d = new Date();
  const h = String(d.getHours()).padStart(2, '0');
  const m = String(d.getMinutes()).padStart(2, '0');
  return `${h}:${m}`;
};
const daysSinceDate = dateStr => {
  if (!dateStr) return 0;
  const out = new Date(dateStr);
  if (isNaN(out.getTime())) return 0;
  const now = new Date();
  const diff = now.setHours(0, 0, 0, 0) - out.setHours(0, 0, 0, 0);
  return Math.floor(diff / (1000 * 60 * 60 * 24));
};
function App() {
  // --- États ---
  const [msalInstance, setMsalInstance] = useState(null);
  const [account, setAccount] = useState(null);
  const [keys, setKeys] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [filter, setFilter] = useState('all');
  const [searchQuery, setSearchQuery] = useState('');
  const [loading, setLoading] = useState(false);
  const [sharePointFileId, setSharePointFileId] = useState(null);
  const [sharePointDriveId, setSharePointDriveId] = useState(null);
  const [isInTeams, setIsInTeams] = useState(false);
  const [accessToken, setAccessToken] = useState(null);

  // --- État de la modale de retour ---
  const [returnModal, setReturnModal] = useState({
    open: false,
    keyId: null,
    keyNumber: '',
    owner: '',
    date: '',
    time: '',
    person: ''
  });
  const [formData, setFormData] = useState({
    keyNumber: '',
    owner: '',
    status: 'sortie',
    personGiving: '',
    personBorrowing: '',
    reason: '',
    dateOut: todayDate(),
    timeOut: nowTime(),
    dateIn: '',
    timeIn: '',
    personReturning: '',
    photoFile: null,
    photoPreview: null
  });

  // --- Détection du contexte Teams (l'initialisation + notifySuccess se font déjà avant Babel) ---
  useEffect(() => {
    const detectTeams = async () => {
      try {
        if (!window.microsoftTeams || !window.microsoftTeams.app) return;
        // L'initialize a déjà été fait par le script inline en début de body.
        // On attend juste qu'il soit terminé, puis on récupère le contexte.
        const start = Date.now();
        while (!window.__teamsInitialized && Date.now() - start < 5000) {
          await new Promise(r => setTimeout(r, 50));
        }
        try {
          await window.microsoftTeams.app.getContext();
          setIsInTeams(true);
          console.log('✓ Exécution dans Teams confirmée');
        } catch (_) {/* SDK présent mais pas dans Teams */}
      } catch (_) {/* hors Teams */}
    };
    detectTeams();
  }, []);

  // --- Initialisation MSAL ---
  useEffect(() => {
    initializeMsal();
  }, []);
  const initializeMsal = async () => {
    // Configuration MSAL compatible Teams Desktop :
    // - sessionStorage : évite les conflits de cache entre onglets/instances Teams
    // - allowNativeBroker:false : désactive le broker natif (incompatible iframe Teams)
    // - timeouts iframe/frame : empêchent MSAL d'utiliser le mode iframe qui est bloqué dans Teams
    // - navigateToLoginRequestUrl:false : pas de redirection automatique après auth
    const msalConfig = {
      auth: {
        clientId: "7248ed4b-0b72-49f6-819d-87e4813fd80c",
        authority: "https://login.microsoftonline.com/9b6f0a5e-fd44-4a3f-a1de-430911fda398",
        redirectUri: window.location.origin + window.location.pathname,
        navigateToLoginRequestUrl: false
      },
      cache: {
        cacheLocation: "sessionStorage",
        storeAuthStateInCookie: false
      },
      system: {
        allowNativeBroker: false,
        windowHashTimeout: 60000,
        iframeHashTimeout: 6000,
        loadFrameTimeout: 0
      }
    };
    try {
      const msal = new window.msal.PublicClientApplication(msalConfig);
      await msal.initialize();
      setMsalInstance(msal);
      const response = await msal.handleRedirectPromise();
      if (response) {
        setAccount(response.account);
      } else {
        const accounts = msal.getAllAccounts();
        if (accounts.length > 0) setAccount(accounts[0]);
      }
    } catch (error) {
      console.error('Erreur initialisation MSAL:', error);
      alert("Erreur d'initialisation de l'authentification: " + error.message);
    }
  };

  // Charger si déjà connecté
  useEffect(() => {
    if (account) {
      loadKeysFromSharePoint();
    }
  }, [account]);

  // --- Auth ---
  const handleLogin = async () => {
    try {
      setLoading(true);
      if (isInTeams) {
        // Dans Teams : flux OAuth2 PKCE via popup Teams (auth-start → auth-end → notifySuccess)
        // loginPopup MSAL ne fonctionne pas dans l'iframe Teams.
        const authStartUrl = 'https://laurentallsi.github.io/gestion-cles/auth-start.html';
        const token = await window.microsoftTeams.authentication.authenticate({
          url: authStartUrl,
          width: 600,
          height: 535
        });
        setAccessToken(token);
        try {
          const payload = JSON.parse(atob(token.split('.')[1].replace(/-/g, '+').replace(/_/g, '/')));
          setAccount({ name: payload.name || payload.preferred_username || 'Utilisateur', username: payload.upn || payload.preferred_username || '' });
        } catch (_) {
          setAccount({ name: 'Utilisateur', username: '' });
        }
      } else {
        if (!msalInstance) {
          alert('Authentification non initialisée. Veuillez rafraîchir la page.');
          return;
        }
        // Hors Teams : loginRedirect est plus robuste que loginPopup (pas de blocage navigateur)
        await msalInstance.loginRedirect({ scopes: ["User.Read", "Files.ReadWrite.All", "Sites.ReadWrite.All"] });
        // Le retour est géré par handleRedirectPromise() dans initializeMsal
      }
    } catch (error) {
      console.error('Erreur de connexion:', error);
      alert('Erreur lors de la connexion Microsoft: ' + (error.message || error));
    } finally {
      setLoading(false);
    }
  };
  const handleLogout = () => {
    if (msalInstance) {
      msalInstance.logoutPopup();
      setAccount(null);
      setKeys([]);
    }
  };
  const getAccessToken = async () => {
    if (isInTeams) {
      // Dans Teams : utiliser le token stocké, ou re-authentifier via popup Teams si expiré/absent
      if (accessToken) return accessToken;
      const authStartUrl = 'https://laurentallsi.github.io/gestion-cles/auth-start.html';
      const token = await window.microsoftTeams.authentication.authenticate({
        url: authStartUrl,
        width: 600,
        height: 535
      });
      setAccessToken(token);
      return token;
    }
    const request = {
      scopes: ["User.Read", "Files.ReadWrite.All", "Sites.ReadWrite.All"],
      account: account
    };
    try {
      const response = await msalInstance.acquireTokenSilent(request);
      return response.accessToken;
    } catch (error) {
      const response = await msalInstance.acquireTokenPopup(request);
      return response.accessToken;
    }
  };

  // -------------------------------------------------------
  //  Lecture du fichier Excel sur SharePoint (optimisée)
  // -------------------------------------------------------
  const loadKeysFromSharePoint = async () => {
    try {
      setLoading(true);
      const token = await getAccessToken();

      // 1) Résoudre le site
      const siteUrl = "allsimmo.sharepoint.com:/sites/ALLSIMMO-ClsLocationGestion";
      const siteResponse = await fetch(`https://graph.microsoft.com/v1.0/sites/${siteUrl}`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });
      if (!siteResponse.ok) throw new Error('Site SharePoint non trouvé.');
      const siteData = await siteResponse.json();
      const siteId = siteData.id;

      // 2) Récupérer le drive Documents (racine = /Documents)
      const driveResponse = await fetch(`https://graph.microsoft.com/v1.0/sites/${siteId}/drive`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });
      if (!driveResponse.ok) throw new Error("Drive 'Documents' non trouvé.");
      const driveData = await driveResponse.json();
      const driveId = driveData.id;
      setSharePointDriveId(driveId);

      // 3) Essai 1 : chemin officiel exact (sans "Shared Documents")
      let tried = [];
      let fileResponse = null;
      const tryPath = async path => {
        tried.push(path);
        const encoded = encodeURIComponent(path).replace(/%2F/g, '/');
        const res = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/root:${encoded}`, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });
        return res;
      };
      const preferredPaths = ["/Clés Location Gestion Vente/Gestion_Cles_Agence.xlsx", "/Gestion_Cles_Agence.xlsx"];
      for (const p of preferredPaths) {
        const res = await tryPath(p);
        if (res.ok) {
          fileResponse = res;
          break;
        }
      }

      // 4) Fallback : recherche globale par nom (insensible à la casse)
      if (!fileResponse || !fileResponse.ok) {
        console.warn('Recherche automatique du fichier dans tout le drive…');
        const searchRes = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/root/search(q='Gestion_Cles_Agence.xlsx')`, {
          headers: {
            Authorization: `Bearer ${token}`
          }
        });
        if (searchRes.ok) {
          const data = await searchRes.json();
          const hit = (data.value || []).find(v => (v.name || '').toLowerCase() === 'gestion_cles_agence.xlsx');
          if (hit) {
            fileResponse = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${hit.id}`, {
              headers: {
                Authorization: `Bearer ${token}`
              }
            });
          }
        }
      }
      if (!fileResponse || !fileResponse.ok) {
        const msg = `Fichier introuvable. Chemins testés :\n- ${tried.join('\n- ')}\nAstuce : vérifiez le nom exact et l'emplacement dans \'Clés Location Gestion Vente\'.`;
        throw new Error(msg);
      }
      const fileData = await fileResponse.json();
      const fileId = fileData.id;
      setSharePointFileId(fileId);

      // 5) Télécharger le contenu Excel
      const contentRes = await fetch(`https://graph.microsoft.com/v1.0/drives/${driveId}/items/${fileId}/content`, {
        headers: {
          Authorization: `Bearer ${token}`
        }
      });
      if (!contentRes.ok) throw new Error('Téléchargement du fichier Excel impossible.');
      const blob = await contentRes.blob();
      const arrayBuffer = await blob.arrayBuffer();
      const workbook = XLSX.read(arrayBuffer, {
        type: 'array'
      });
      const sheet = workbook.Sheets['Registre des Clés'];
      if (!sheet) {
        alert("Feuille 'Registre des Clés' non trouvée dans l'Excel.");
        setKeys([]);
        return;
      }
      const rows = XLSX.utils.sheet_to_json(sheet);
      const loadedKeys = rows.map((row, index) => ({
        id: (Date.now() + index).toString(),
        keyNumber: row['N° Clé'] || '',
        owner: row['Propriétaire/Bailleur/Copropriété'] || '',
        reason: row['Motif'] || '',
        personGiving: row['Remise par'] || '',
        personBorrowing: row['Empruntée par'] || '',
        dateOut: row['Date sortie'] || '',
        timeOut: row['Heure sortie'] || '',
        dateIn: row['Date retour'] || null,
        timeIn: row['Heure retour'] || null,
        personReturning: row['Retournée par'] || null,
        status: (row['Statut'] || '').toLowerCase() || (row['Date retour'] ? 'retournee' : 'sortie'),
        photoUrl: row['Photo'] || null
      }));
      setKeys(loadedKeys);
      console.log('Clés chargées:', loadedKeys.length);
    } catch (error) {
      console.error('Erreur de chargement complète:', error);
      alert('Erreur lors du chargement: ' + error.message);
    } finally {
      setLoading(false);
    }
  };

  // -------------------------------------------------------
  //  Sauvegarde des données dans l'Excel (écriture)
  // -------------------------------------------------------
  const saveKeysToSharePoint = async updatedKeys => {
    try {
      const token = await getAccessToken();
      if (!sharePointFileId || !sharePointDriveId) throw new Error('Fichier SharePoint non initialisé.');
      const excelData = updatedKeys.map(k => ({
        'N° Clé': k.keyNumber,
        'Propriétaire/Bailleur/Copropriété': k.owner,
        'Motif': k.reason,
        'Remise par': k.personGiving,
        'Empruntée par': k.personBorrowing,
        'Date sortie': k.dateOut,
        'Heure sortie': k.timeOut,
        'Date retour': k.dateIn || '',
        'Heure retour': k.timeIn || '',
        'Retournée par': k.personReturning || '',
        'Statut': k.dateIn ? 'retournee' : 'sortie',
        'Photo': k.photoUrl || ''
      }));
      const wb = XLSX.utils.book_new();
      const ws = XLSX.utils.json_to_sheet(excelData);
      ws['!cols'] = [{
        wch: 12
      }, {
        wch: 32
      }, {
        wch: 20
      }, {
        wch: 18
      }, {
        wch: 20
      }, {
        wch: 12
      }, {
        wch: 12
      }, {
        wch: 12
      }, {
        wch: 12
      }, {
        wch: 18
      }, {
        wch: 12
      }, {
        wch: 60
      }];
      XLSX.utils.book_append_sheet(wb, ws, 'Registre des Clés');
      const wbout = XLSX.write(wb, {
        bookType: 'xlsx',
        type: 'array'
      });
      const blob = new Blob([wbout], {
        type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
      });
      const uploadResponse = await fetch(`https://graph.microsoft.com/v1.0/drives/${sharePointDriveId}/items/${sharePointFileId}/content`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'
        },
        body: blob
      });
      if (!uploadResponse.ok) {
        const errorText = await uploadResponse.text();
        console.error('Erreur upload:', errorText);
        throw new Error('Erreur lors de la synchronisation avec SharePoint');
      }
      console.log('✅ Synchronisé avec SharePoint');
      await loadKeysFromSharePoint();
    } catch (error) {
      console.error('Erreur de sauvegarde:', error);
      throw error;
    }
  };

  // -------------------------------------------------------
  //  Upload photo → dossier /Clés Location Gestion Vente/Photos_Cles
  // -------------------------------------------------------
  const uploadPhotoToOneDrive = async (file, keyNumber) => {
    try {
      const token = await getAccessToken();
      if (!sharePointDriveId) throw new Error('Drive SharePoint non initialisé');
      const folderPath = "/Clés Location Gestion Vente/Photos_Cles";
      const encodedFolderPath = encodeURIComponent(folderPath).replace(/%2F/g, '/');

      // Vérifier le dossier (GET) ou le créer
      let folderOk = false;
      const checkRes = await fetch(`https://graph.microsoft.com/v1.0/drives/${sharePointDriveId}/root:${encodedFolderPath}`, {
        headers: {
          'Authorization': `Bearer ${token}`
        }
      });
      folderOk = checkRes.ok;
      if (!folderOk) {
        const parentPath = "/Clés Location Gestion Vente";
        const encodedParentPath = encodeURIComponent(parentPath).replace(/%2F/g, '/');
        const createRes = await fetch(`https://graph.microsoft.com/v1.0/drives/${sharePointDriveId}/root:${encodedParentPath}:/children`, {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            name: 'Photos_Cles',
            folder: {},
            '@microsoft.graph.conflictBehavior': 'rename'
          })
        });
        if (!createRes.ok) throw new Error("Impossible de créer le dossier 'Photos_Cles'.");
      }
      const timestamp = Date.now();
      const extension = (file.name.split('.').pop() || 'jpg').toLowerCase();
      const safeKey = (keyNumber || 'sans_numero').toString().replace(/[^a-zA-Z0-9]/g, '_');
      const fileName = `cle_${safeKey}_${timestamp}.${extension}`;
      const uploadPath = `${folderPath}/${fileName}`;
      const encodedUploadPath = encodeURIComponent(uploadPath).replace(/%2F/g, '/');
      const uploadResponse = await fetch(`https://graph.microsoft.com/v1.0/drives/${sharePointDriveId}/root:${encodedUploadPath}:/content`, {
        method: 'PUT',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': file.type || 'image/jpeg'
        },
        body: file
      });
      if (!uploadResponse.ok) throw new Error("Erreur lors de l'upload de la photo");
      const uploadData = await uploadResponse.json();
      const shareResponse = await fetch(`https://graph.microsoft.com/v1.0/drives/${sharePointDriveId}/items/${uploadData.id}/createLink`, {
        method: 'POST',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          type: 'view',
          scope: 'organization'
        })
      });
      if (!shareResponse.ok) return null;
      const shareData = await shareResponse.json();
      return shareData.link?.webUrl || null;
    } catch (error) {
      console.error('Erreur upload photo:', error);
      throw error;
    }
  };

  // --- Handlers formulaire ---
  const handleInputChange = e => {
    const {
      name,
      value
    } = e.target;
    setFormData(prev => ({
      ...prev,
      [name]: value
    }));
  };
  const handlePhotoChange = e => {
    const file = e.target.files[0];
    if (file) {
      if (file.size > 5 * 1024 * 1024) {
        alert('La photo est trop volumineuse (max 5MB)');
        return;
      }
      const reader = new FileReader();
      reader.onloadend = () => {
        setFormData(prev => ({
          ...prev,
          photoFile: file,
          photoPreview: reader.result
        }));
      };
      reader.readAsDataURL(file);
    }
  };
  const resetForm = () => {
    setFormData({
      keyNumber: '',
      owner: '',
      status: 'sortie',
      personGiving: '',
      personBorrowing: '',
      reason: '',
      dateOut: todayDate(),
      timeOut: nowTime(),
      dateIn: '',
      timeIn: '',
      personReturning: '',
      photoFile: null,
      photoPreview: null
    });
  };
  const handleSubmit = async e => {
    e.preventDefault();
    setLoading(true);
    try {
      let photoUrl = null;
      if (formData.photoFile) {
        try {
          photoUrl = await uploadPhotoToOneDrive(formData.photoFile, formData.keyNumber);
        } catch (_) {
          alert("⚠️ Erreur lors de l'upload de la photo. La clé sera enregistrée sans photo.");
        }
      }
      const newKey = {
        id: Date.now().toString(),
        keyNumber: formData.keyNumber,
        owner: formData.owner,
        status: 'sortie',
        personGiving: formData.personGiving,
        personBorrowing: formData.personBorrowing,
        reason: formData.reason,
        dateOut: formData.dateOut,
        timeOut: formData.timeOut,
        dateIn: null,
        timeIn: null,
        personReturning: null,
        photoUrl: photoUrl,
        createdAt: new Date().toISOString()
      };
      const updatedKeys = [...keys, newKey];
      await saveKeysToSharePoint(updatedKeys);
      setShowForm(false);
      resetForm();
      alert('✅ Clé enregistrée avec succès !');
    } catch (error) {
      console.error('Erreur complète:', error);
      alert("❌ Erreur lors de l'enregistrement: " + error.message);
    } finally {
      setLoading(false);
    }
  };

  // Ouvre la modale avec date/heure du jour pré-remplies
  const openReturnModal = key => {
    setReturnModal({
      open: true,
      keyId: key.id,
      keyNumber: key.keyNumber,
      owner: key.owner,
      date: todayDate(),
      time: nowTime(),
      person: ''
    });
  };
  const closeReturnModal = () => {
    setReturnModal({
      open: false,
      keyId: null,
      keyNumber: '',
      owner: '',
      date: '',
      time: '',
      person: ''
    });
  };
  const handleReturnModalChange = e => {
    const {
      name,
      value
    } = e.target;
    setReturnModal(prev => ({
      ...prev,
      [name]: value
    }));
  };
  const submitReturn = async e => {
    e.preventDefault();
    const {
      keyId,
      date,
      time,
      person
    } = returnModal;
    if (!keyId || !date || !time || !person.trim()) {
      alert('Merci de remplir tous les champs.');
      return;
    }
    setLoading(true);
    try {
      const updatedKeys = keys.map(k => k.id === keyId ? {
        ...k,
        dateIn: date,
        timeIn: time,
        personReturning: person.trim(),
        status: 'retournee'
      } : k);
      await saveKeysToSharePoint(updatedKeys);
      closeReturnModal();
      alert('✅ Retour enregistré !');
    } catch (error) {
      console.error('Erreur:', error);
      alert('❌ Erreur: ' + error.message);
    } finally {
      setLoading(false);
    }
  };
  const handleDelete = async keyId => {
    if (!window.confirm('Êtes-vous sûr de vouloir supprimer cet enregistrement ?')) return;
    setLoading(true);
    try {
      const updated = keys.filter(k => k.id !== keyId);
      await saveKeysToSharePoint(updated);
      alert('✅ Clé supprimée !');
    } catch (error) {
      console.error('Erreur:', error);
      alert('❌ Erreur: ' + error.message);
    } finally {
      setLoading(false);
    }
  };

  // --- Filtrage + recherche + tri ---
  const isDefinitive = k => k.reason === 'sortie-definitive';
  const filteredKeys = keys.filter(key => {
